<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div id="app">
    <nav id="menu">
        <input id="filter" type="text" placeholder="Filter pages">
        <div id="pages">
            <p><a href="home/home.html" target="view">Home</a></p>
            <p><a href="contact/contact.html" target="view">Contact</a></p>
            <p><a href="buzzwords/buzzwords.html" target="view">Buzzwords</a></p>
            <p>Articles:</p>
            <p><a href="articles/ai-coding/ai-coding.html" target="view">AI Coding</a></p>
            <p><a href="articles/mdc-demo/mdc-demo.html" target="view">MDC Demo</a></p>
        </div>
    </nav>

    <iframe id="view" name="view" src="home/home.html" title="Page view"></iframe>
</div>
<script>
    const filter = document.getElementById('filter');
    const entries = Array.from(document.querySelectorAll('#pages p'));
    const links = Array.from(document.querySelectorAll('#pages a'));

    // Filter
    filter.addEventListener('input', function () {
        const q = filter.value.toLowerCase();
        entries.forEach(function (entry) {
            const text = entry.textContent.toLowerCase();
            entry.style.display = text.includes(q) ? '' : 'none';
        });
    });

    // Active highlight
    function setActive(linkEl) {
        links.forEach(l => l.classList.remove('active'));
        linkEl.classList.add('active');
    }

    links.forEach(link => {
        link.addEventListener('click', function () {
            setActive(link);
        });
    });

    // Default (Home selected on load)
    setActive(links[0]);
</script>
</body>
</html>
